[package]
name = "penkaku-gui"
description = "PenKaku: desktop client for pen-plotter handwriting machines (gpui + gpui-component)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "penkaku"
path = "src/main.rs"

[dependencies]
penkaku-core = { workspace = true, features = ["segment"] }
penkaku-template.workspace = true
penkaku-import.workspace = true
penkaku-device.workspace = true
penkaku-doc.workspace = true
penkaku-output.workspace = true
gpui-kit.workspace = true
async-channel.workspace = true
env_logger.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true

[build-dependencies]
# Same version gpui already builds with; embeds the Windows icon (build.rs).
embed-resource = "3.0.12"
