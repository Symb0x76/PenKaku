[workspace]
resolver = "3"
members = [
    "crates/chixie-rs-core",
    "crates/chixie-rs-template",
    "crates/chixie-rs-import",
    "crates/chixie-rs-device",
    "crates/chixie-rs-doc",
    "crates/chixie-rs-output",
    "crates/chixie-rs-cli",
    "crates/chixie-rs-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
chixie-rs-core = { path = "crates/chixie-rs-core" }
chixie-rs-device = { path = "crates/chixie-rs-device" }
chixie-rs-doc = { path = "crates/chixie-rs-doc" }
chixie-rs-output = { path = "crates/chixie-rs-output" }
chixie-rs-template = { path = "crates/chixie-rs-template" }
chixie-rs-import = { path = "crates/chixie-rs-import" }
aes = "0.8"
base64 = "0.23.1"
cbc = "0.1"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
hmac = "0.12"
log = "0.4.35"
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "json",
    "multipart",
    "query",
    "rustls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = "4.10.1"
sha2 = "0.10"
thiserror = "2.0.21"
# UI: gpui-kit bundles gpui (gpui-pre =0.3.11), gpui_platform and gpui-component 0.9.0 as
# one coherent pin. Exact version only; bump deliberately and re-run the gpui identity check
# (`cargo tree -p chixie-rs-gui -i gpui-pre` must show exactly one instance).
gpui-kit = "=0.9.0"
async-channel = "2"
toml = "1"
# Documents are DOCX: our own minimal OOXML on zip + quick-xml (deflate only).
zip = { version = "9.6", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }
quick-xml = "0.41"
proptest = "1.12"
jieba-rs = "0.11"
notify = "8.2"
directories = "6"
keyring = "4.2"
# Font preview PNGs → ink masks. Same crate instance gpui already pulls in.
image = { version = "0.25.10", default-features = false, features = ["png"] }

# Dependencies (gpui, lyon, image, ...) are optimised in debug builds too: the debug build CI
# ships stays responsive, while our own crates keep fast incremental compiles.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3     # Maximum optimization (release default)
lto = "fat"       # Enable cross-crate linking time optimization (Link Time Optimization), which can significantly improve performance; you can also choose "thin" to speed up compilation
codegen-units = 1 # Limit the number of parallel code generation units to 1, allowing LLVM to perform more global optimizations (which will significantly increase compilation time)
panic = "abort"   # When a panic occurs, terminate the process directly instead of unwinding the call stack (unwind), reducing the size and slightly improving performance
strip = "symbols" # Automatically strip debug symbols, significantly reducing the final executable file size (you can also choose "debuginfo")

[profile.relwithdebuginfo]
inherits = "release" # Must inherit release, otherwise it will default to inheriting dev (no optimization)
debug = true         # Or debug = 1 (only keep line number table, smaller size)
strip = "none"       # Ensure no symbol information is stripped

[profile.relminsize]
inherits = "release"
opt-level = "z"      # Optimized for minimum size (more aggressive than "s")
lto = true           # Enable linking time optimization to remove unused dead code
codegen-units = 1
panic = "abort"
strip = true

[profile.relnative]
inherits = "release"
# Pwsh: $env:RUSTFLAGS="-C target-cpu=native" cargo build --release
# -sh: RUSTFLAGS="-C target-cpu=native" cargo build --profile relnative
