name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # gpui needs X11/Wayland/Vulkan headers on Linux; serialport needs libudev; keyring needs
      # D-Bus; Mesa's software Vulkan driver lets the GUI autotest run under xvfb.
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libudev-dev libdbus-1-dev libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libvulkan-dev mesa-vulkan-drivers libzstd-dev xvfb

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # 导出 PDF: a ruled sample page per OS, to open and check by eye.
      - name: Sample PDF
        shell: bash
        run: ./target/debug/chixie-rs-cli pdf "你好你好" --font-json crates/chixie-rs-core/tests/fixtures/font_fixture.json --out sample-${{ runner.os }}.pdf

      - name: Upload sample PDF
        uses: actions/upload-artifact@v4
        with:
          name: sample-pdf-${{ runner.os }}
          path: sample-${{ runner.os }}.pdf
          if-no-files-found: error

      # Scripted GUI run against the fake backend and simulated Grbl (see crates/chixie-rs-gui/src/main.rs).
      # Non-blocking until it has passed on each runner once (GPU/display availability differs).
      - name: GUI autotest
        continue-on-error: true
        shell: bash
        env:
          CHIXIE_RS_AUTOTEST: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then run="xvfb-run -a"; else run=""; fi
          $run ./target/debug/chixie-rs${{ runner.os == 'Windows' && '.exe' || '' }} | tee autotest.log
          grep -q 'AUTOTEST_DOCX round_trip=true' autotest.log
          grep -q 'AUTOTEST_DEVICE connected=Some("模拟设备") pages_done=2/2 sheet_card=Some(((0, 1), 1)) jog_zero_while_waiting=true card_after_last=None recoveries=0 outcome=Some(Done)' autotest.log
          grep -q 'AUTOTEST_RESUME from=Some(.*) next_page=Some(1) outcome=Some(Done)' autotest.log
          grep -q 'AUTOTEST_TYPESET align=Right indent=true half_space=true right_at_margin=true punct_issues=0' autotest.log
          grep -q 'AUTOTEST_BACKSTAGE closed=Ok(true)' autotest.log
          grep -q 'AUTOTEST_FONTS watched=true english_routed=true export_import=true' autotest.log
          grep -q 'AUTOTEST_EFFECTS tuned=true undo=true route=true' autotest.log
          grep -q 'AUTOTEST_TUNE preview=true font_key=true bigger=true' autotest.log
          grep -q 'AUTOTEST_OUTPUT pens=2 serpentine=true rotated=true' autotest.log
          grep -q 'AUTOTEST_TABLE tab=true cells=4 overflow_fixed=true batch_pages=30 docx=true' autotest.log
          grep -qF 'AUTOTEST_DETECT pdf_cells=Some([10]) photo_cells=Some([14]) background=true' autotest.log
          grep -q 'AUTOTEST_LIBRARY roundtrip=true background=true gallery=true' autotest.log
          grep -q 'AUTOTEST_FORMAT underline=true paste=true replace_keeps_ids=true import_txt=true pdf=true restored=true' autotest.log
          grep -q 'AUTOTEST_SCRIPT english_scaled=true' autotest.log
          grep -q 'AUTOTEST_FIRMWARE written=true restored=true rows=15' autotest.log
          grep -q 'AUTOTEST_PERF pages=' autotest.log

      # Windows: the exes (icon embedded by build.rs). macOS: chixie-rs.app with its .icns.
      # Linux: binaries, .desktop entry, hicolor icons and install.sh. macOS and Linux are tarred
      # because artifact zips drop the executable bit.
      - name: Package
        shell: bash
        run: |
          t=target/debug; r=crates/chixie-rs-gui/resources
          mkdir -p dist
          case "$RUNNER_OS" in
            Windows)
              cp $t/chixie-rs.exe $t/chixie-rs-cli.exe dist/ ;;
            macOS)
              app=dist/chixie-rs.app/Contents
              mkdir -p $app/MacOS $app/Resources
              cp $t/chixie-rs $app/MacOS/
              cp $r/macos/Info.plist $app/
              cp $r/icon/chixie-rs.icns $app/Resources/
              plutil -lint $app/Info.plist
              codesign --force --deep --sign - dist/chixie-rs.app
              cp $t/chixie-rs-cli dist/
              tar -czf chixie-rs-macOS.tar.gz -C dist . ;;
            Linux)
              p=dist/chixie-rs
              mkdir -p $p/icons
              cp $t/chixie-rs $t/chixie-rs-cli $r/linux/chixie-rs.desktop $r/linux/install.sh $p/
              cp $r/icon/png/*.png $p/icons/
              chmod +x $p/install.sh
              tar -czf chixie-rs-Linux.tar.gz -C dist chixie-rs ;;
          esac

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: chixie-rs-${{ runner.os }}-debug
          path: ${{ runner.os == 'Windows' && 'dist/' || format('chixie-rs-{0}.tar.gz', runner.os) }}
          if-no-files-found: error
