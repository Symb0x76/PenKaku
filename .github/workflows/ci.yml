name: CI

on:
  push:
  pull_request:
  workflow_dispatch:


env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Only a version tag (v*) uploads anything: the sample PDFs, the debug packages and the
  # optimised portable packages, which the release job attaches to a draft release.
  TAGGED: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - uses: Swatinem/rust-cache@v2

    # gpui needs X11/Wayland/Vulkan headers on Linux; serialport needs libudev; keyring needs
    # D-Bus; Mesa's software Vulkan driver lets the GUI autotest run under xvfb.
    - name: Linux system packages
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config libudev-dev libdbus-1-dev libfontconfig-dev libfreetype-dev \
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
          libvulkan-dev mesa-vulkan-drivers libzstd-dev xvfb

    - name: Build
      run: cargo build --workspace --all-targets

    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Tests
      run: cargo test --workspace

    # 导出 PDF: a ruled sample page per OS, to open and check by eye.
    - name: Sample PDF
      shell: bash
      run: ./target/debug/penkaku-cli pdf "你好你好" --font-json crates/penkaku-core/tests/fixtures/font_fixture.json --out sample-${{ runner.os }}.pdf

    - name: Upload sample PDF
      if: env.TAGGED == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: release-sample-pdf-${{ runner.os }}
        path: sample-${{ runner.os }}.pdf
        if-no-files-found: error

    # Scripted GUI run against the fake backend and simulated Grbl (see crates/penkaku-gui/src/main.rs).
    # Non-blocking until it has passed on each runner once (GPU/display availability differs).
    - name: GUI autotest
      continue-on-error: true
      shell: bash
      env:
        PENKAKU_AUTOTEST: "1"
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then run="xvfb-run -a"; else run=""; fi
        $run ./target/debug/penkaku${{ runner.os == 'Windows' && '.exe' || '' }} | tee autotest.log
        grep -q 'AUTOTEST_DOCX round_trip=true' autotest.log
        grep -q 'AUTOTEST_DEVICE connected=Some("模拟设备") pages_done=2/2 sheet_card=Some(((0, 1), 1)) jog_zero_while_waiting=true card_after_last=None recoveries=0 outcome=Some(Done)' autotest.log
        grep -q 'AUTOTEST_RESUME from=Some(.*) next_page=Some(1) outcome=Some(Done)' autotest.log
        grep -q 'AUTOTEST_TYPESET align=Right indent=true half_space=true right_at_margin=true punct_issues=0' autotest.log
        grep -q 'AUTOTEST_BACKSTAGE closed=Ok(true)' autotest.log
        grep -q 'AUTOTEST_FONTS watched=true english_routed=true export_import=true' autotest.log
        grep -q 'AUTOTEST_EFFECTS tuned=true undo=true route=true' autotest.log
        grep -q 'AUTOTEST_TUNE preview=true font_key=true bigger=true' autotest.log
        grep -q 'AUTOTEST_OUTPUT pens=2 serpentine=true rotated=true' autotest.log
        grep -q 'AUTOTEST_TABLE tab=true cells=4 overflow_fixed=true batch_pages=30 docx=true' autotest.log
        grep -q 'AUTOTEST_INLINE_TABLE cells=9 frame=8 docx=true restored=true' autotest.log
        grep -q 'AUTOTEST_DIAGRAM drawn=true errors=0 in_gcode=true docx=true' autotest.log
        grep -qF 'AUTOTEST_DETECT pdf_cells=Some([10]) photo_cells=Some([14]) background=true' autotest.log
        grep -q 'AUTOTEST_LIBRARY roundtrip=true background=true gallery=true' autotest.log
        grep -q 'AUTOTEST_FORMAT underline=true paste=true replace_keeps_ids=true import_txt=true pdf=true restored=true' autotest.log
        grep -q 'AUTOTEST_SCRIPT english_scaled=true' autotest.log
        grep -q 'AUTOTEST_FIRMWARE written=true restored=true rows=15' autotest.log
        grep -q 'AUTOTEST_PERF pages=' autotest.log
        grep -qF 'AUTOTEST_PICTURES saved=true spaces=[(1, 60.0, 40.0), (2, 30.0, 30.0)] sheets=1 images=2' autotest.log

    # Debug package (checked on every run, uploaded only for tags).
    # Windows: the exes (icon embedded by build.rs). macOS: penkaku.app with its .icns.
    # Linux: binaries, .desktop entry, hicolor icons and install.sh. All are archived here
    # because artifact zips drop the executable bit.
    - name: Package debug
      shell: bash
      run: |
        t=target/debug; r=crates/penkaku-gui/resources; p=dist/penkaku
        mkdir -p $p
        case "$RUNNER_OS" in
          Windows)
            cp $t/penkaku.exe $t/penkaku-cli.exe $p/
            (cd dist && 7z a -tzip ../penkaku-debug-Windows.zip penkaku) ;;
          macOS)
            app=$p/penkaku.app/Contents
            mkdir -p $app/MacOS $app/Resources
            cp $t/penkaku $app/MacOS/
            cp $r/macos/Info.plist $app/
            cp $r/icon/penkaku.icns $app/Resources/
            plutil -lint $app/Info.plist
            codesign --force --deep --sign - $p/penkaku.app
            cp $t/penkaku-cli $p/
            tar -czf penkaku-debug-macOS.tar.gz -C dist penkaku ;;
          Linux)
            mkdir -p $p/icons
            cp $t/penkaku $t/penkaku-cli $r/linux/penkaku.desktop $r/linux/install.sh $p/
            cp $r/icon/png/*.png $p/icons/
            chmod +x $p/install.sh
            tar -czf penkaku-debug-Linux.tar.gz -C dist penkaku ;;
        esac

    - name: Upload debug package
      if: env.TAGGED == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: release-debug-${{ runner.os }}
        path: ${{ runner.os == 'Windows' && 'penkaku-debug-Windows.zip' || format('penkaku-debug-{0}.tar.gz', runner.os) }}
        if-no-files-found: error

    # Portable release build: optimised binaries plus a `portable` marker, so settings, fonts
    # and templates go to a `data` folder beside the program (next to penkaku.app on macOS).
    # Fat LTO is slow, so only for version tags.
    - name: Build release
      if: env.TAGGED == 'true'
      run: cargo build --release -p penkaku-gui -p penkaku-cli

    - name: Package portable
      if: env.TAGGED == 'true'
      shell: bash
      run: |
        t=target/release; r=crates/penkaku-gui/resources; p=portable/penkaku
        mkdir -p $p
        touch $p/portable
        case "$RUNNER_OS" in
          Windows)
            cp $t/penkaku.exe $t/penkaku-cli.exe $p/
            (cd portable && 7z a -tzip ../penkaku-portable-Windows.zip penkaku) ;;
          macOS)
            app=$p/penkaku.app/Contents
            mkdir -p $app/MacOS $app/Resources
            cp $t/penkaku $app/MacOS/
            cp $r/macos/Info.plist $app/
            cp $r/icon/penkaku.icns $app/Resources/
            codesign --force --deep --sign - $p/penkaku.app
            cp $t/penkaku-cli $p/
            tar -czf penkaku-portable-macOS.tar.gz -C portable penkaku ;;
          Linux)
            cp $t/penkaku $t/penkaku-cli $p/
            tar -czf penkaku-portable-Linux.tar.gz -C portable penkaku ;;
        esac

    - name: Upload portable package
      if: env.TAGGED == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: release-portable-${{ runner.os }}
        path: ${{ runner.os == 'Windows' && 'penkaku-portable-Windows.zip' || format('penkaku-portable-{0}.tar.gz', runner.os) }}
        if-no-files-found: error

  # For a version tag: a GitHub Draft Release with every uploaded file (portable, debug and
  # sample PDF per OS). Notes are filled in and the release is published by hand.
  release:
    name: Draft Release
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # No checkout in this job, so gh needs the repository named.
      GH_REPO: ${{ github.repository }}
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: release-assets
        merge-multiple: true

    - name: Verify artifacts
      shell: bash
      run: |
        ls -la release-assets
        for f in penkaku-portable-Windows.zip penkaku-portable-macOS.tar.gz penkaku-portable-Linux.tar.gz \
                 penkaku-debug-Windows.zip penkaku-debug-macOS.tar.gz penkaku-debug-Linux.tar.gz \
                 sample-Windows.pdf sample-macOS.pdf sample-Linux.pdf; do
          test -f "release-assets/$f" || { echo "missing $f"; exit 1; }
        done

    - name: Create draft release
      shell: bash
      run: |
        if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
        else
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes ""
        fi
